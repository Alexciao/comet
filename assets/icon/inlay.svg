<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Inlay: a gem set flush into a tile, with the text caret right after it. -->
  <defs>
    <linearGradient id="tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FC8B8"/>
      <stop offset="1" stop-color="#086E69"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="24" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- the socket's upper edges sit in shadow, the lower edges catch the light -->
    <linearGradient id="socket" x1="0" y1="60" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#033D3A"/>
      <stop offset=".55" stop-color="#05524E"/>
      <stop offset="1" stop-color="#16A197"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="58" x2="0" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F6F3"/>
    </linearGradient>
    <clipPath id="gem">
      <rect x="-48" y="-48" width="96" height="96" rx="14"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="28" y="32" width="200" height="200" rx="44" fill="#000000" opacity=".2" filter="url(#shadow)"/>
  <rect x="24" y="24" width="208" height="208" rx="46" fill="url(#tile)"/>
  <rect x="24" y="24" width="208" height="208" rx="46" fill="url(#sheen)"/>

  <!-- socket, sunk into the tile -->
  <rect x="-54" y="-54" width="108" height="108" rx="20" fill="url(#socket)" transform="translate(111 128) rotate(45)"/>

  <!-- gem: lit from above, upper facets bright, lower facets in mint shade -->
  <g transform="translate(111 128) rotate(45)" clip-path="url(#gem)">
    <rect x="-48" y="-48" width="96" height="96" fill="#D9F3EE"/>
    <path d="M-48 -48 H48 L0 0 Z" fill="#F2FCFA"/>
    <path d="M48 -48 V48 L0 0 Z" fill="#BDE8E1"/>
    <path d="M48 48 H-48 L0 0 Z" fill="#D2F1EB"/>
    <path d="M-48 48 V-48 L0 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- caret -->
  <rect x="195" y="58" width="18" height="140" rx="9" fill="url(#caret)"/>
</svg>
