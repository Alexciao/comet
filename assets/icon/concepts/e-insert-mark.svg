<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EC7B8"/><stop offset="1" stop-color="#0A7E78"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5F5EF"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="208" height="208" rx="52" fill="url(#tile)"/>
  <!-- the piece to insert, set into a socket -->
  <rect x="90" y="52" width="76" height="76" rx="20" fill="#065E59"/>
  <rect x="96" y="58" width="64" height="64" rx="14" fill="url(#piece)"/>
  <!-- line of text, opened at the insertion point -->
  <rect x="52" y="146" width="56" height="18" rx="9" fill="#FFFFFF" opacity=".6"/>
  <rect x="148" y="146" width="56" height="18" rx="9" fill="#FFFFFF" opacity=".6"/>
  <!-- proofreader's insertion caret -->
  <path d="M100 200 L128 160 L156 200" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
