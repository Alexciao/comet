name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.arch }}-

      # Warnings are errors (Directory.Build.props), so this is also the analyzer gate.
      - name: Build (x64, whole solution)
        if: matrix.arch == 'x64'
        run: dotnet build Inlay.sln -c Release

      - name: Build (arm64, app)
        if: matrix.arch == 'arm64'
        run: dotnet build src/Inlay.App/Inlay.App.csproj -c Release -r win-arm64 -p:Platform=ARM64

      - name: Unit tests (core, incl. the search golden set and the network-usage guard)
        if: matrix.arch == 'x64'
        run: dotnet test tests/Inlay.Core.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Unit tests (platform)
        if: matrix.arch == 'x64'
        run: dotnet test tests/Inlay.Platform.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results

      # The end-to-end tests (tests/Inlay.E2E) drive a real desktop with real keystrokes and are run locally.

      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x64'
        with:
          name: test-results
          path: artifacts/test-results/
