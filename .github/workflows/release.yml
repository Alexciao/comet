name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.arch }}-

      - name: Version from the tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          "Inlay $v"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process "$env:RUNNER_TEMP\is.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          }

      - name: Native AOT publish, installer, portable zip
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}

      # Optional: runs only when Azure Trusted Signing secrets are configured; unsigned builds otherwise.
      - name: Sign (Azure Trusted Signing)
        if: env.HAS_SIGNING == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: artifacts/installer
          files-folder-filter: exe

      - uses: actions/upload-artifact@v4
        with:
          name: inlay-${{ matrix.arch }}
          path: |
            artifacts/installer/Inlay-Setup-${{ matrix.arch }}.exe
            artifacts/installer/Inlay-Portable-${{ matrix.arch }}.zip
            artifacts/installer/Inlay-Symbols-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum Inlay-Setup-*.exe Inlay-Portable-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Inlay ${GITHUB_REF_NAME#v}" --generate-notes --latest \
            assets/Inlay-Setup-x64.exe assets/Inlay-Portable-x64.zip assets/Inlay-Setup-arm64.exe assets/Inlay-Portable-arm64.zip assets/SHA256SUMS.txt
